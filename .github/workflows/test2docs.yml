name: Test2Docs Workflow
on:
  push:
    branches: [main]
    paths:
      - 'packages/test2doc-playwright/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/test2docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/test2doc-playwright/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/test2docs.yml'

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Branch Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Node Setup
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: "latest"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('packages/test2doc-playwright/package.json') }}

      - name: Install Playwright Dependencies
        run: pnpm playwright install --with-deps

      - name: Build Test2Doc
        run: pnpm build:test2doc

      - name: Run Tests
        run: pnpm test:test2doc
        env:
          CI: true

      - name: Upload Screenshot Diffs
        if: failure()  # Only when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs-${{ github.run_number }}
          path: packages/test2doc-playwright/tests/expected-screenshots/*-diff.png
          retention-days: 30
