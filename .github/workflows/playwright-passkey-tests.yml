name: Playwright Passkey Tests

on:
  push:
    branches: [main]
    paths:
      - 'packages/playwright-passkey/**'
      - 'packages/playwright-passkey-gen/**'
      - '.github/workflows/playwright-passkey-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/playwright-passkey/**'
      - 'packages/playwright-passkey-gen/**'
      - '.github/workflows/playwright-passkey-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/playwright-passkey-gen

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build playwright-passkey dependency
        run: pnpm build
        working-directory: packages/playwright-passkey

      - name: Run tests
        run: pnpm ci:test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/playwright-passkey-gen/playwright-report/
          retention-days: 30