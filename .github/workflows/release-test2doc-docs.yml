name: Deploy test2doc-docs

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/test2doc-docs/src/**'
      - 'apps/test2doc-docs/blog/**'
      - 'apps/test2doc-docs/docs/**'
      - 'apps/test2doc-docs/workers/**'
      - 'apps/test2doc-docs/static/**'
      - 'apps/test2doc-docs/docusaurus.config.js'
      - 'apps/test2doc-docs/sidebars.js'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Bump version & create tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd apps/test2doc-docs
          # choose patch/minor/major or pass as input; here we use patch
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          TAG="test2doc-docs-v${NEW_VERSION}"
          # commit version bump and create custom annotated tag
          git add package.json package-lock.json 2>/dev/null || true
          git commit -m "chore(test2doc-docs): Release v${NEW_VERSION} [skip ci]"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin HEAD --follow-tags

      - name: Build Docusaurus site
        working-directory: ./apps/test2doc-docs
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        working-directory: ./apps/test2doc-docs
        run: |
          pnpm run deploy

      - name: Build worker JS
        working-directory: ./apps/test2doc-docs
        run: pnpm run build:worker

      - name: Publish Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        working-directory: ./apps/test2doc-docs
        run: |
          pnpm run deploy:worker