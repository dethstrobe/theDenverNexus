services:
  playwright-ci:
    build:
      context: .
      dockerfile: Dockerfile.ci
    volumes:
      # Mount the test files so changes are reflected
      - ./packages/test2doc-playwright/tests:/workspace/packages/test2doc-playwright/tests
      # Mount the source code
      - ./packages/test2doc-playwright/src:/workspace/packages/test2doc-playwright/src
      # Protect node_modules from being overwritten
      - /workspace/node_modules
      - /workspace/packages/test2doc-playwright/node_modules
    environment:
      - NODE_ENV=test
      - CI=true
    working_dir: /workspace/packages/test2doc-playwright
    command: pnpm test